name: Tests

on:
  push:
    tags:
      - v*
    branches:
      - trunk
  pull_request:

jobs:
  # Code linting
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false

      - name: Lint code
        uses: golangci/golangci-lint-action@v9

  # Unit testing
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.26', '1.27']
    steps:
      - name: Set up go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Check out code
        uses: actions/checkout@v7

      - name: Run unit tests
        run: make test
